<title>Label Review Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a review desk — what needs a look on the left, the case explained on the right, the raw file folded below. */
  :root {
    --bg: #f4f5f2; --panel: #ffffff; --well: #eef0ec; --fg: #1c211d; --muted: #5d665f; --line: #d9ddd6;
    --accent: #2f6b4f; --accent-fg: #ffffff; --ok: #2f7d4f; --warn: #a36a00; --bad: #b3372b; --sel: #e6eee9;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #131714; --panel: #1b201c; --well: #222823; --fg: #e5e9e4; --muted: #9aa49c; --line: #303830;
    --accent: #6fbf95; --accent-fg: #0f1a14; --ok: #6fbf95; --warn: #e0a84a; --bad: #ef7b6e; --sel: #26302a; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #131714; --panel: #1b201c; --well: #222823; --fg: #e5e9e4; --muted: #9aa49c; --line: #303830;
    --accent: #6fbf95; --accent-fg: #0f1a14; --ok: #6fbf95; --warn: #e0a84a; --bad: #ef7b6e; --sel: #26302a; color-scheme: dark }

  body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; display: grid; gap: 16px; }
  header { display: grid; gap: 6px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .lede { margin: 0; color: var(--muted); max-width: 75ch; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; color: inherit; font-weight: 500; }
  .tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tab .n { font-variant-numeric: tabular-nums; opacity: .75; margin-left: 4px; }
  .desk { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 780px) { .desk { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .list { list-style: none; margin: 0; padding: 4px; max-height: 74vh; overflow-y: auto; }
  .list li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 6px; display: grid; gap: 3px; cursor: pointer; font: inherit; color: inherit; }
  .list li button:hover { background: var(--well); }
  .list li button[aria-current="true"] { background: var(--sel); }
  button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row1 { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12.5px; font-weight: 500; }
  .ttl { font-size: 13px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .pill { font-family: var(--sans); font-size: 11.5px; font-weight: 500; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .pill.open { color: var(--bad); } .pill.gap { color: var(--warn); } .pill.settled { color: var(--ok); }
  .detail { display: grid; }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
  .sec:last-child { border-bottom: 0; }
  .sec h2 { margin: 0; font-family: var(--mono); font-size: 16px; font-weight: 500; }
  .sec h3 { margin: 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }
  .sec p { margin: 0; max-width: 78ch; }
  .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
  .sop { border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--well); border-radius: 0 6px 6px 0; font-size: 13.5px; }
  .three { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .box { background: var(--well); border-radius: 6px; padding: 10px 12px; display: grid; gap: 3px; min-width: 0; }
  .box b { font-weight: 600; }
  .code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .note { color: var(--muted); font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--muted); font-weight: 500; }
  .case { margin: 8px 0 0; font-family: var(--mono); font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow-y: auto; }
  .decide { display: grid; gap: 10px; }
  .decide-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .decide label { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
  select, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  textarea { min-height: 52px; resize: vertical; width: 100%; box-sizing: border-box; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 14px; cursor: pointer; font: inherit; font-weight: 500; color: inherit; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .status { font-size: 12.5px; color: var(--muted); } .status.err { color: var(--bad); }
  .empty { padding: 24px 16px; color: var(--muted); }
  @media (prefers-reduced-motion: no-preference) { .list li button { transition: background .12s ease-out; } }
</style>

<div class="wrap">
  <header>
    <h1>Label Review Desk</h1>
    <p class="lede">Which cases still need a look, what happened in each, and what we know. The SOP decides: anything a POLICY.md clause settles moves to the Settled tab with the clause quoted. Open questions are for the organisers; rule gaps are code to write.</p>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-look" aria-selected="true">To look at<span class="n" id="n-look">0</span></button>
    <button class="tab" role="tab" id="tab-settled" aria-selected="false">Settled by the SOP<span class="n" id="n-settled">0</span></button>
  </div>
  <div class="desk">
    <section class="panel" aria-label="Cases"><ul class="list" id="list"><li class="empty">Loading…</li></ul></section>
    <section class="panel detail" id="detail" aria-label="Case"><div class="empty">Pick a case.</div></section>
  </div>
</div>

<script>
(() => {
  const CODES = {
    CLOSE: ["COLLECTION_DOCUMENTED","BUSINESS_RECORDS_RECONCILE","DOCUMENTED_EVENT","INVOICE_MATCHES","OWN_ACCOUNT","GROUP_COMPANY","THIRD_PARTY_DOCUMENTED","REFUND_OF_EARLIER_PAYMENT","RETURNING_CUSTOMER","LIST_MATCH_DIFFERENT_PARTY","WITHIN_PROFILE"],
    RFI: ["RFI_PURPOSE_DOCUMENTS","RFI_BUSINESS_RECORDS","RFI_SOURCE_OF_FUNDS","RFI_COUNTERPARTY_DETAILS","RFI_UPDATED_PROFILE"],
    ESCALATE: ["ESC_MULE_ACTIVITY","ESC_STRUCTURING","ESC_UNEXPLAINED_FUNDS","ESC_PASS_THROUGH","ESC_INVOICE_MISMATCH","ESC_HIGH_RISK_CORRIDOR","ESC_ACCOUNT_MISUSE","ESC_THIRD_PARTY_FUNDING","ESC_EARLY_REDEMPTION","ESC_LISTED_PARTY"],
  };
  const INST = {bank: "Bank", emoney: "E-money", investment: "Investment", payments_fx: "Payments and FX"};
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pill = (status) => el("span", "pill " + (status === "open question" ? "open" : status === "rule gap" ? "gap" : "settled"), status);

  let tab = "look", queue = [], settled = [], decisions = {}, current = null, db = null, user = null, myId = null, names = {};
  const rows = () => (tab === "look" ? queue : settled);

  function renderList() {
    const ul = $("#list"); ul.replaceChildren();
    $("#n-look").textContent = queue.length; $("#n-settled").textContent = settled.length;
    $("#tab-look").setAttribute("aria-selected", String(tab === "look"));
    $("#tab-settled").setAttribute("aria-selected", String(tab === "settled"));
    const list = rows();
    if (!list.length) { ul.append(el("li", "empty", db ? "Nothing here." : "Sign in to claude.ai to load the desk.")); return; }
    for (const it of list) {
      const li = el("li"), b = el("button"); b.type = "button";
      b.setAttribute("aria-current", String(current === it.case_id));
      const r1 = el("span", "row1"); r1.append(document.createTextNode(it.case_id), tab === "look" ? pill(decisions[it.case_id] ? "settled" : it.status) : pill("settled"));
      const t = el("span", "ttl", tab === "look" ? it.title : `${it.verdict} · ${it.reason_code.replace(/_/g, " ").toLowerCase()}`);
      const s = el("span", "sub", tab === "look" ? `${INST[it.institution]} · owner: ${it.owner}` : INST[it.institution]);
      b.append(r1, t, s);
      b.addEventListener("click", () => { current = it.case_id; renderList(); renderDetail(); });
      li.append(b); ul.append(li);
    }
  }

  function sec(title, ...kids) { const s = el("div", "sec"); if (title) s.append(el("h3", null, title)); s.append(...kids); return s; }
  function box(title, verdict, code, note) {
    const b = el("div", "box"); b.append(el("h3", null, title), el("b", null, verdict || "—"), el("div", "code", code || ""));
    if (note) b.append(el("div", "note", note)); return b;
  }

  function renderDetail() {
    const d = $("#detail"); d.replaceChildren();
    const it = rows().find((x) => x.case_id === current);
    if (!it) { d.append(el("div", "empty", "Pick a case.")); return; }
    const head = el("div", "sec"); const hl = el("div", "head");
    hl.append(el("h2", null, it.case_id), el("span", "sub", INST[it.institution]), tab === "look" ? pill(it.status) : pill("settled"));
    head.append(hl);
    if (tab === "look") head.append(el("p", "ttl", it.title));
    d.append(head);

    if (tab === "settled") {
      d.append(sec("Decision", el("p", null, `${it.verdict} · ${it.reason_code}`)));
      d.append(sec("What happened", el("p", null, it.note || "—")));
      d.append(sec("Why the SOP settles it", el("p", "sop", it.sop_basis)));
      if (it.model) d.append(sec("Blind model's view", el("p", it.model.verdict === it.verdict ? null : "note",
        it.model.verdict === it.verdict ? `Agrees: ${it.model.verdict} · ${it.model.reason_code}` : `Disagrees: ${it.model.verdict} · ${it.model.reason_code}. The SOP reasoning above stands.`)));
      return;
    }

    d.append(sec("What happened", el("p", null, it.summary)));
    d.append(sec("What to decide", el("p", null, it.decide)));
    const three = el("div", "three");
    if (it.label) three.append(box("Our label", it.label.verdict, it.label.reason_code, it.label.note));
    if (it.model) three.append(box("Blind model", it.model.verdict, it.model.reason_code, (it.model.says || "").slice(0, 320) + ((it.model.says || "").length > 320 ? "…" : "")));
    three.append(box("Our system now", it.system.verdict, it.system.reason_code, it.system.reason));
    d.append(sec("What we know", el("p", null, it.know), three));
    d.append(sec("SOP clause", el("p", "sop", it.sop)));
    const det = el("details"); det.append(el("summary", null, "Full case file (alerts, transactions, documents)"), el("pre", "case", it.case_text));
    d.append(sec(null, det));

    if (it.status === "open question") {
      const dec = decisions[it.case_id];
      const form = el("form", "decide");
      if (dec) form.append(el("p", "note", `Recorded by ${names[dec.by] || "someone"}: ${dec.verdict} · ${dec.reason_code}${dec.note ? " — " + dec.note : ""}`));
      const row = el("div", "decide-row");
      const vl = el("label", null, "Verdict"); const v = el("select"); v.id = "d-verdict";
      for (const x of ["CLOSE", "RFI", "ESCALATE"]) v.append(new Option(x, x, false, x === (dec ? dec.verdict : it.label && it.label.verdict)));
      vl.append(v);
      const cl = el("label", null, "Reason code"); const c = el("select"); c.id = "d-code";
      const fill = (keep) => c.replaceChildren(...CODES[v.value].map((k) => new Option(k, k, false, k === keep)));
      fill(dec ? dec.reason_code : it.label && it.label.reason_code); v.addEventListener("change", () => fill(null));
      cl.append(c); row.append(vl, cl);
      const nl = el("label", null, "What decided it (e.g. the organisers' answer)"); const n = el("textarea"); n.id = "d-note"; n.value = (dec && dec.note) || ""; nl.append(n);
      const act = el("div", "decide-row"); const save = el("button", "btn primary", "Record the answer"); save.type = "submit";
      const st = el("span", "status"); st.setAttribute("aria-live", "polite"); act.append(save, st);
      form.append(row, nl, act);
      if (!db) { save.disabled = true; st.textContent = "Sign in to claude.ai to record answers."; }
      form.addEventListener("submit", async (e) => {
        e.preventDefault(); if (!db) return; save.disabled = true; st.className = "status"; st.textContent = "Saving…";
        try {
          await db.collection("decisions").doc(it.case_id).set({ case_id: it.case_id, agree: !!(it.label && v.value === it.label.verdict && c.value === it.label.reason_code),
            verdict: v.value, reason_code: c.value, note: n.value.trim(), by: myId || "", at: new Date().toISOString() });
          st.textContent = "Saved. Claude folds it into the labels at the next check-in.";
        } catch { st.className = "status err"; st.textContent = "Not saved: you may only have view access. Ask Andrei for contributor access."; }
        finally { save.disabled = false; }
      });
      d.append(sec("Record the answer", form));
    } else {
      d.append(sec("What happens next", el("p", null, `This is code to write, not a label to change. Owner: ${it.owner}. It leaves this list when the system gets the case right.`)));
    }
  }

  $("#tab-look").addEventListener("click", () => { tab = "look"; current = queue[0] && queue[0].case_id; renderList(); renderDetail(); });
  $("#tab-settled").addEventListener("click", () => { tab = "settled"; current = settled[0] && settled[0].case_id; renderList(); renderDetail(); });
  renderList();

  (async () => {
    try { [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); } catch { db = null; }
    if (user) { try { myId = await user.id(); } catch {} }
    if (!db) { renderList(); renderDetail(); return; }
    db.collection("queue").onSnapshot((snap) => {
      queue = snap.docs.filter((s) => s.exists).map((s) => s.data()).sort((a, b) => (a.priority || 9) - (b.priority || 9) || a.case_id.localeCompare(b.case_id));
      if (tab === "look" && !queue.find((q) => q.case_id === current)) current = queue[0] && queue[0].case_id;
      renderList(); renderDetail();
    }, () => { $("#list").replaceChildren(el("li", "empty", "The desk could not be loaded. Reload the page.")); });
    db.collection("settled").onSnapshot((snap) => {
      settled = snap.docs.filter((s) => s.exists).map((s) => s.data()).sort((a, b) => a.case_id.localeCompare(b.case_id));
      renderList(); if (tab === "settled") renderDetail();
    });
    db.collection("decisions").onSnapshot(async (snap) => {
      decisions = {}; for (const s of snap.docs) if (s.exists) decisions[s.id] = s.data();
      const ids = [...new Set(Object.values(decisions).map((x) => x.by).filter(Boolean))];
      if (user && ids.length) { try { const ps = await user.profiles(ids); for (const id of ids) names[id] = (ps[id] && ps[id].name) || "Someone"; } catch {} }
      renderList(); renderDetail();
    });
  })();
})();
</script>
